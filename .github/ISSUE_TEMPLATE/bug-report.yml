# 0xVerse Student Projects

This repository is the academy's index and guidance hub for independent student projects. Independent applications should normally use separate repositories named for the project without exposing unnecessary personal information.

## Contents

- `project-index/` — reviewed links and short descriptions
- `templates/` — lightweight planning and delivery guidance
- `docs/` — onboarding and assessment documentation

This is not a monorepo for every student application.
