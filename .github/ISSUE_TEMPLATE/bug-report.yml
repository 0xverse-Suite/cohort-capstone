# 0xVerse Academy Website

This repository is the canonical workspace for the official 0xVerse Academy website. Product code will be added through reviewed Issues and pull requests.

## Workflow

Work from an assigned Issue on `feature/<student-or-team>/<task>` or `fix/<area>/<task>`. Open a pull request, link the Issue, pass checks, and obtain a mentor review before merge. Direct pushes to `main` are prohibited.

See [CONTRIBUTING.md](CONTRIBUTING.md).
